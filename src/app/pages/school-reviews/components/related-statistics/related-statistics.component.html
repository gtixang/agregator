<div class="related">
  <span class="related__title">Отзывы о других школах</span>
  @for (school of related; track $index) {
    <div class="related__line">
      <span class="related__name">{{ school.name }}</span>
      <span class="related__count"> {{ school.reviewsCount }} отзывов </span>
      <span class="related__rating">{{ school.rating }} ★</span>
    </div>
  }
</div>
