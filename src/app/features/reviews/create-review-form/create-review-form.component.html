<h3 class="title">Оставить отзыв</h3>
<p class="desc">В данном разделе вы можете оставить ваш отзыв о компании Skillbox</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
  <div class="rating">
    <app-select-rating #stars formControlName="rating"></app-select-rating>
  </div>
  <input type="text" class="input" formControlName="authorName" placeholder="Ваше имя" />
  <input
    type="text"
    class="input"
    formControlName="title"
    placeholder="Введите заголовок отзыва"
  />
  <textarea
    name=""
    id=""
    class="text"
    formControlName="text"
    placeholder="Напишите ваш отзыв"
  ></textarea>
  <app-button [disabled]="form.invalid" (click)="onSubmit()" class="is-accent submit-btn">
    Оставить отзыв
  </app-button>
</form>
