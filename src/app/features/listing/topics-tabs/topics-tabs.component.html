@if (categories$ | async; as categoriesData) {
  <ul class="list m-bt">
    <app-async-status [data]="categoriesData">
      <ng-template let-categories>
        @for (category of categories; track category.slug) {
          <li
            class="item"
            [class.is-active]="selectedCategory === category.slug"
            (click)="selectCategory(category.slug)"
          >
            {{ category.title }}
          </li>
        }
      </ng-template>
    </app-async-status>
  </ul>
}
